services:
  api:
    build:
      context: ./backend
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      EMBED_BACKEND: ${EMBED_BACKEND:-auto}
      RAG_FORCE_MOCK: ${RAG_FORCE_MOCK:-false}
      RAG_SAMPLE_DIR: /app/data/samples
      RAG_INDEX_PATH: /var/lib/rag/index.json
      CORS_ORIGINS: "*"
    volumes:
      - rag-index:/var/lib/rag
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 8

  web:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  rag-index:
